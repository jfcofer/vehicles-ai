test_size: 0.2

xgboost:
  run_name: xgboost_baseline
  max_depth: 5
  learning_rate: 0.1
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  scale_pos_weight: 200
  max_delta_step: 0

lightgbm:
  run_name: lightgbm_baseline
  num_leaves: 15
  learning_rate: 0.1
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_samples: 5
  scale_pos_weight: 50

attention:
  run_name: attention_baseline
  d_model: 64
  nhead: 4
  num_layers: 3
  dropout: 0.1
  batch_size: 128
  learning_rate: 0.001
  n_epochs: 50
