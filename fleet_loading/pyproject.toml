[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "fleet_loading"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro~=1.5.0",
]

[project.scripts]
fleet_loading = "fleet_loading.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "fleet_loading.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "fleet_loading"
project_name = "Fleet Loading"
kedro_init_version = "1.5.0"
tools = "['Data Structure']"
example_pipeline = "False"
source_dir = "src"
